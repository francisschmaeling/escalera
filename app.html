<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escalera app demo</title>
<meta name="description" content="Escalera student and teacher screens with sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #0447C6; --brand-hover: #0A3AA3; --brand-50: #EFF4FF; --brand-100: #DCE6FD; --brand-200: #BFD3FD;
    --navy: #0B2A75; --ink: #1F2937; --body: #374151; --muted: #6B7280; --faint: #9CA3AF;
    --line: #E5E7EB; --line-2: #D1D5DB; --bg: #F5F7FB; --panel: #F9FAFB;
    --coral: #F46158; --coral-dark: #B42318; --coral-50: #FFF1EE; --coral-100: #FFE2DC; --coral-300: #FBA59B;
    --skill: #1E3A8A;
    --shadow: 0 1px 2px rgb(16 24 40 / .05);
    --serif: Gelasio, Georgia, "Times New Roman", serif;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #F5F7FB; } }
  :root[data-theme="dark"] { --bg: #F5F7FB; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  h1, h2, h3, p, dl, dd, ol, ul { margin: 0; }
  ol, ul { padding: 0; list-style: none; }
  a { color: var(--brand); font-weight: 600; text-decoration: none; }
  a:hover { color: var(--brand-hover); }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg { display: block; flex: none; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--muted); }
  .serif { font-family: var(--serif); font-weight: 700; color: var(--navy); letter-spacing: -0.01em; }

  /* demo switch (floating, out of the way) */
  .demobar { position: fixed; z-index: 40; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 10px 25px -5px rgb(16 24 40 / .15), 0 0 0 1px rgb(16 24 40 / .08); font-size: 13px; }
  .demobar span { padding: 0 8px 0 10px; color: var(--muted); font-weight: 500; }
  .demobar a { padding: 6px 12px; border-radius: 999px; color: var(--body); font-weight: 600; }
  .demobar a.on { background: var(--brand); color: #FFFFFF; }

  /* logo */
  .logo { display: inline-flex; align-items: center; gap: 10px; color: var(--navy); }
  .logo svg { width: 28px; height: auto; color: var(--brand); }
  .logo span { font-family: var(--serif); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; }
  .logo:hover { color: var(--navy); }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border: 0; border-radius: 8px; font-size: 15px; font-weight: 600; line-height: 20px; text-decoration: none; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap; transition: background-color .15s ease; }
  .btn svg { width: 20px; height: 20px; }
  .btn-primary { background: var(--brand); color: #FFFFFF; }
  .btn-primary:hover { background: var(--brand-hover); color: #FFFFFF; }
  .btn-secondary { background: #FFFFFF; color: var(--brand-hover); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-2); }
  .btn-secondary:hover { background: var(--panel); color: var(--brand-hover); }
  .btn-two { flex-direction: column; gap: 0; min-height: 56px; padding: 8px 24px; }
  .btn-two small { font-size: 13px; line-height: 18px; font-weight: 400; opacity: .85; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  /* cards */
  .card { background: #FFFFFF; border-radius: 12px; box-shadow: var(--shadow), 0 0 0 1px rgb(16 24 40 / .07); }
  .pad { padding: clamp(20px, 2.8vw, 36px); }
  .card-title { font-family: var(--serif); font-weight: 700; font-size: clamp(21px, 1.7vw, 24px); line-height: 1.2; color: var(--navy); }
  .card-sub { margin-top: 6px; font-size: 15px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .wrap-row { flex-wrap: wrap; }
  .mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; } .mt-8 { margin-top: 32px; }
  .divider { height: 1px; background: var(--line); border: 0; margin: 24px 0; }

  /* avatar, chips */
  .av { width: 40px; height: 40px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--brand-50); color: var(--brand-hover); font-size: 14px; font-weight: 700; }
  .count { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: var(--brand); color: #FFFFFF; font-size: 13px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 8px 14px; border-radius: 8px; background: var(--coral-50); color: var(--ink); font-size: 16px; font-weight: 700; }
  .chip small { font-size: 14px; font-weight: 400; color: var(--muted); }

  /* forms */
  .label { display: block; font-size: 15px; font-weight: 600; color: var(--ink); }
  .label small { margin-left: 8px; font-weight: 400; color: var(--muted); font-size: 14px; }
  .input { display: block; width: 100%; margin-top: 8px; padding: 10px 14px; border: 0; border-radius: 8px; background: #FFFFFF; color: var(--ink); font-size: 16px; line-height: 24px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line-2); }
  .input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--brand); }
  textarea.input { resize: vertical; min-height: 52px; }
  .field + .field { margin-top: 20px; }
  .seg { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .seg button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #FFFFFF; color: var(--brand-hover); font-weight: 600; cursor: pointer; box-shadow: var(--shadow), inset 0 0 0 1px var(--line-2); }
  .seg button svg { width: 18px; height: 18px; }
  .seg button[aria-pressed="true"] { background: var(--brand); color: #FFFFFF; box-shadow: var(--shadow); }

  /* ================= STUDENT ================= */
  .sbar { position: sticky; top: 0; z-index: 20; background: #FFFFFF; border-bottom: 1px solid var(--line); }
  .sbar .in { display: flex; align-items: center; gap: 16px 24px; min-height: 72px; max-width: 1280px; margin: 0 auto; padding: 12px clamp(16px, 3vw, 32px); }
  .sbar .ctx { padding-left: 24px; border-left: 1px solid var(--line); line-height: 1.35; }
  .sbar .ctx b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); }
  .sbar .ctx small { font-size: 14px; color: var(--muted); }
  .sbar .prog { margin-left: auto; width: min(340px, 30vw); }
  .sbar .prog small { font-size: 14px; color: var(--muted); }
  .bar { height: 8px; margin-top: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
  .sbar .who { display: flex; align-items: center; gap: 12px; font-weight: 500; color: var(--ink); }
  .sbar .prog + .who { margin-left: 8px; }
  .sbar .who:first-of-type { margin-left: auto; }
  .smain { max-width: 1280px; margin: 0 auto; padding: clamp(16px, 3vw, 32px) clamp(16px, 3vw, 32px) 96px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(16px, 2.4vw, 32px); align-items: start; }

  /* join + today */
  .center { min-height: calc(100vh - 74px); min-height: calc(100svh - 74px); display: flex; align-items: center; justify-content: center; padding: 32px 0; }
  .center .card { width: min(100%, 440px); }
  .hello { font-family: var(--serif); font-weight: 700; font-size: clamp(30px, 3vw, 38px); line-height: 1.15; color: var(--navy); }
  .hello-sub { margin-top: 6px; font-size: 17px; color: var(--muted); }
  .today-title { font-family: var(--serif); font-weight: 700; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; color: var(--navy); }
  .kicker { font-size: 14px; font-weight: 600; color: var(--brand); }
  .meta { margin-top: 12px; font-size: 15px; color: var(--muted); }
  .week li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .week li:first-child { border-top: 0; }
  .week .dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 2px var(--line-2); color: #FFFFFF; }
  .week .dot.done { background: var(--brand); box-shadow: none; }
  .week .dot.now { box-shadow: inset 0 0 0 2px var(--coral); }
  .week b { display: block; font-weight: 600; font-size: 15px; }
  .week small { font-size: 13px; color: var(--muted); }
  .week .score { font-size: 14px; color: var(--muted); }

  /* practice */
  .ptitle { font-family: var(--serif); font-weight: 700; font-size: clamp(32px, 3.2vw, 42px); line-height: 1.1; color: var(--navy); }
  .paras { margin-top: 24px; display: flex; flex-direction: column; gap: 6px; }
  .paras li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 8px; padding: 12px 16px; border-radius: 10px; font-size: clamp(17px, 1.4vw, 19px); line-height: 1.75; color: var(--ink); }
  .paras li span { padding-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .paras li.hl { background: var(--brand-50); }
  .paras li.hl span { color: var(--brand); }
  .ladder { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .ladder i { display: block; height: 6px; border-radius: 999px; background: var(--line); }
  .ladder b { display: block; margin-top: 12px; font-size: 15px; font-weight: 700; color: var(--ink); }
  .ladder small { display: block; margin-top: 6px; font-size: 14px; color: var(--muted); }
  .ladder .missed i { background: var(--faint); }
  .ladder .now i { background: var(--coral); }
  .ladder .now small { color: var(--coral-dark); font-weight: 700; }
  .ladder .won i { background: var(--brand); }
  .ladder .won small { color: var(--brand); font-weight: 700; }
  .banner { margin-top: 28px; padding: 18px 20px; border-radius: 10px; background: var(--coral-50); }
  .banner b { display: block; font-size: 17px; font-weight: 700; color: var(--ink); }
  .banner span { display: block; margin-top: 4px; font-size: 15px; color: #6B4B45; }
  .qtext { margin-top: 28px; font-size: clamp(21px, 2vw, 26px); line-height: 1.45; font-weight: 700; color: var(--ink); }
  .qes { margin-top: 6px; font-size: 16px; color: var(--muted); }
  .gl { padding: 0 6px; border-radius: 6px; background: var(--coral-100); text-decoration: underline dotted var(--coral); text-decoration-thickness: 2px; text-underline-offset: 5px; }
  .glossary { margin-top: 24px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 28px; padding: 20px 24px; border-radius: 10px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-size: 16px; }
  .glossary dt { font-weight: 700; color: var(--ink); }
  .glossary dd { color: var(--body); }
  .example { margin-top: 24px; padding: 18px 20px; border-radius: 10px; background: var(--brand-50); font-size: 15px; color: var(--ink); }
  .example b { color: var(--navy); }
  .example ol { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; list-style: decimal; padding-left: 20px; }
  .example small { display: block; color: var(--muted); }
  .choices { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
  .choice { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1px var(--line-2); font-size: 18px; color: var(--ink); cursor: pointer; transition: box-shadow .15s ease, background .15s ease; }
  .choice input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; flex: none; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 0 0 2px var(--faint); cursor: pointer; }
  .choice input:checked { box-shadow: inset 0 0 0 7px var(--brand); }
  .choice small { display: block; font-size: 15px; color: var(--muted); }
  .choice:hover { box-shadow: inset 0 0 0 1px var(--brand-200); }
  .choice.sel, .choice.right { background: var(--brand-50); box-shadow: inset 0 0 0 2px var(--brand); }
  .choice.wrong { background: var(--coral-50); box-shadow: inset 0 0 0 2px var(--coral); }
  .choice.wrong input:checked { box-shadow: inset 0 0 0 7px var(--coral); }
  .qactions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .result { margin-top: 24px; padding: 20px; border-radius: 10px; }
  .result.ok { background: var(--brand); color: #FFFFFF; }
  .result.ok .btn { background: #FFFFFF; color: var(--brand-hover); }
  .result.no { background: var(--coral-50); color: var(--ink); }
  .result b { display: block; font-size: 17px; }
  .result p { margin-top: 4px; font-size: 15px; }
  .result .btn { margin-top: 16px; }

  /* respond */
  .ace { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; margin-top: 22px; }
  .ace .ltr { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--brand-50); color: var(--brand); font-family: var(--serif); font-weight: 700; font-size: 20px; }
  .rec { margin-top: 24px; padding: 32px 16px; border-radius: 10px; box-shadow: inset 0 0 0 2px var(--line); text-align: center; }
  .rec .mic { width: 64px; height: 64px; margin: 0 auto; border: 0; border-radius: 50%; background: var(--brand); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .rec .mic svg { width: 26px; height: 26px; }
  .rec .mic.on { background: var(--coral); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgb(244 97 88 / .18); } }
  .fb li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 14px; padding: 18px 0; border-top: 1px solid var(--line); }
  .mark { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 2px var(--brand); color: #FFFFFF; }
  .mark.met { background: var(--brand); box-shadow: none; }
  .mark svg { width: 15px; height: 15px; }
  .fb b { font-weight: 700; }
  .fb b span { font-weight: 400; }
  .fb p { margin-top: 4px; color: var(--ink); }
  .fb p.es { color: var(--muted); }
  .gram { margin-top: 8px; padding: 20px; border-radius: 10px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .gram b { font-weight: 700; }
  .gram p { margin-top: 10px; }
  .gram p.es { color: var(--muted); }
  .fixes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .fixes span { padding: 8px 12px; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px var(--line-2); }
  .fixes s { color: var(--faint); }

  /* results */
  .big { font-family: var(--serif); font-weight: 700; font-size: clamp(56px, 6vw, 80px); line-height: 1; color: var(--navy); }
  .qblocks { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; margin-top: 24px; }
  .qblocks div { text-align: center; font-size: 12px; color: var(--muted); }
  .qblocks i, .blocks i { display: block; border-radius: 5px; background: var(--brand); }
  .qblocks i { height: 40px; margin-bottom: 6px; }
  .qblocks i.words, .blocks i.words, .legend i.words { background: #FFC9C2; box-shadow: inset 0 0 0 1px var(--coral-300); }
  .qblocks i.spanish, .blocks i.spanish, .legend i.spanish { background: var(--coral); }
  .qblocks i.example, .blocks i.example, .legend i.example { background: #FFFFFF; box-shadow: inset 0 0 0 1px var(--line-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { display: block; width: 12px; height: 12px; border-radius: 3px; background: var(--brand); }
  .blocks { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
  .blocks i { height: 22px; border-radius: 4px; }

  /* ================= TEACHER ================= */
  .tapp { display: block; }
  .side { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF; border-bottom: 1px solid var(--line); }
  .side .logo { margin-right: auto; }
  .classbtn { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border: 0; border-radius: 10px; background: #FFFFFF; box-shadow: var(--shadow), inset 0 0 0 1px var(--line-2); text-align: left; cursor: pointer; }
  .classbtn b { display: block; font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--ink); }
  .classbtn small { display: block; font-size: 14px; color: var(--muted); }
  .classbtn svg { width: 18px; height: 18px; color: var(--muted); }
  .tnav { order: 3; width: 100%; display: flex; gap: 4px; overflow-x: auto; }
  .navlink { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 10px; color: var(--ink); font-weight: 500; white-space: nowrap; }
  .navlink svg { width: 22px; height: 22px; color: var(--muted); }
  .navlink:hover { background: var(--panel); color: var(--ink); }
  .navlink.on { background: var(--brand-50); color: var(--brand-hover); font-weight: 700; }
  .navlink.on svg { color: var(--brand); }
  .navlink .count { margin-left: auto; }
  .side .me { display: none; }
  .tmain { max-width: 1240px; padding: clamp(20px, 3vw, 40px) clamp(16px, 3vw, 40px) 96px; }
  .tmain-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(34px, 3.4vw, 46px); line-height: 1.1; color: var(--navy); letter-spacing: -0.01em; }
  .h1-sub { margin-top: 8px; font-size: 17px; color: var(--muted); }
  .summary { margin-top: 24px; font-size: clamp(18px, 1.7vw, 22px); color: var(--ink); }
  .summary a { text-decoration: underline; text-underline-offset: 4px; }
  .grid-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 28px; align-items: start; }
  .stack > * + * { margin-top: 24px; }
  .gap-legend { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; font-size: 15px; color: var(--muted); }
  .gap-legend span { display: inline-flex; align-items: center; gap: 8px; }
  .gap-legend b { color: var(--ink); font-weight: 700; }
  .gap-legend i { width: 16px; height: 16px; border-radius: 4px; background: var(--coral); }
  .gap-legend i.k { background: var(--skill); }
  .gaprow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 18px 0; border-top: 1px solid var(--line); }
  .gaprow .nm { font-weight: 700; color: var(--ink); }
  .gaprow .nm small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
  .split { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: #EEF1F5; }
  .split span { display: block; }
  .split .l { background: var(--coral); }
  .split .k { background: var(--skill); }
  .gaprow .cap { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .recom { font-size: 15px; color: var(--ink); }
  .recom .lang { color: var(--coral-dark); font-weight: 700; }
  .recom .sk { color: var(--skill); font-weight: 700; }
  .tbl-wrap { overflow-x: auto; margin-top: 12px; }
  .tbl { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 15px; }
  .tbl th { padding: 12px 16px 12px 0; text-align: left; font-size: 14px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .tbl td { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
  .tbl td.name a { color: var(--ink); font-weight: 700; }
  .tbl tr.link { cursor: pointer; }
  .tbl tr.link:hover td { background: var(--panel); }
  .own { display: inline-flex; align-items: center; gap: 12px; }
  .own em { width: 38px; text-align: right; font-style: normal; font-variant-numeric: tabular-nums; }
  .meter { width: 100px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }

    var last = s.id === 'daniela' ? supports() : ['own', 'own', s.own > 60 ? 'own' : 'words', 'own', s.gapType === 'k' ? 'example' : 'spanish', 'own', s.own > 50 ? 'own' : 'words', s.own > 80 ? 'own' : 'words'];
    return teacherShell('students',
      '<p><a href="#/t/students">\u2190 Students</a></p><div class="mt-4">' + thead(esc(s.name), s.level + '. ' + s.own + '% on their own this week. Main gap: ' + s.gap.toLowerCase() + '.', '<button class="btn btn-secondary" type="button" data-act="report" data-sid="' + s.id + '">' + I.down + 'Progress report</button>') + '</div>' +
      '<div class="grid-main"><div class="stack">' +
        '<section class="card pad"><h2 class="card-title">Why ' + esc(s.name.split(' ')[0]) + ' missed questions</h2>' + GAPLEGEND + '<div class="mt-4">' + gapRows(rows, max) + '</div></section>' +
      '</div><div class="stack">' +
        '<section class="card pad"><h2 class="card-title">Last session</h2><p class="card-sub">The Tryout. Each block is one question.</p><div class="qblocks">' + blocks(last, true) + '</div>' + legend() + '</section>' +
        (mine.length ? '<section class="card pad"><h2 class="card-title">Responses</h2>' + mine.map(function (r) { return '<div class="resp" style="border-top:0;"><div class="person"><span><b>' + r.kind + ', ' + r.when + '</b></span><a class="btn btn-secondary" href="#/t/review/' + r.id + '">Review</a></div><p class="excerpt">\u201c' + esc(r.text) + '\u201d</p></div>'; }).join('') + '</section>' : '') +
      '</div></div>');
  }

  function pReview(rid) {
    var cur = null;
    for (var i = 0; i < RESPONSES.length; i++) { if (RESPONSES[i].id === (rid || S.selResp)) { cur = RESPONSES[i]; } }
    if (!cur) { cur = RESPONSES[0]; }
    S.selResp = cur.id;
    var st = student(cur.sid), done = S.reviewed.indexOf(cur.id) > -1, ed = S.fbEdits[cur.id] || {};
    var list = RESPONSES.map(function (r) { var s2 = student(r.sid), d = S.reviewed.indexOf(r.id) > -1; return '<button type="button" class="ritem' + (r.id === cur.id ? ' on' : '') + '" data-go="#/t/review/' + r.id + '"><span class="av">' + s2.initials + '</span><span><b>' + esc(s2.name) + '</b><small>' + r.kind + ', ' + r.when + '</small></span><span class="st' + (d ? ' done' : '') + '">' + (d ? 'Sent' : 'New') + '</span></button>'; }).join('');
    var media = cur.kind === 'Spoken' ? '<div class="player"><button type="button" data-act="play" aria-label="Play">' + I.play + '</button><div class="track"><i id="ptrack"></i></div><span class="muted" style="font-size:14px;">' + cur.len + '</span></div>' : '';
    return teacherShell('review',
      thead('Responses', reviewedCount() + ' waiting for your review.') +
      '<div class="review-grid"><section class="card" style="padding:8px;">' + list + '</section>' +
      '<section class="card pad"><div class="person"><span class="av">' + st.initials + '</span><span><b>' + esc(st.name) + '</b><small>' + cur.kind + ', ' + cur.when + '</small></span><a href="#/t/student/' + st.id + '" style="margin-left:auto;">Profile</a></div>' +
      '<p class="mt-6" style="font-weight:700;">Did Maya make the right choice? Use one detail from the text.</p>' + media + '<p class="quote">' + esc(cur.text) + '</p>' +
      '<div class="rub mt-4">' + ['a', 'c', 'e'].map(function (k, j) { var on = ed['r' + k] !== undefined ? ed['r' + k] : !!cur[k]; return '<label><input type="checkbox" data-rub="' + k + '"' + (on ? ' checked' : '') + '>' + ['Answer', 'Cite', 'Explain'][j] + '</label>'; }).join('') + '</div>' +
      '<div class="field mt-6"><label class="label" for="fen">Feedback</label><textarea class="input" id="fen" data-fb="en" rows="3">' + esc(ed.en !== undefined ? ed.en : cur.fb) + '</textarea></div>' +
      '<div class="field"><label class="label" for="fes">Comentarios en espa\u00f1ol</label><textarea class="input" id="fes" data-fb="es" rows="3">' + esc(ed.es !== undefined ? ed.es : cur.fbes) + '</textarea></div>' +
      '<div class="qactions"><span class="muted" style="font-size:14px;">' + (done ? 'Sent to ' + esc(st.name.split(' ')[0]) + '.' : 'Drafted by Escalera. Edit before you send.') + '</span><button class="btn btn-primary" type="button" data-act="sendfb">' + (done ? 'Send again' : 'Send to student') + '</button></div></section></div>');
  }

  function pAssign() {
    var opts = Object.keys(SKILL_NAMES).map(function (c) { return '<option value="' + c + '">' + c + ', ' + SKILL_NAMES[c] + '</option>'; }).join('');
    return teacherShell('assign',
      thead('Assignments', 'Escalera adjusts support for each student.') +
      '<div class="grid-main"><form class="card pad" data-form="assign"><h2 class="card-title">Assign practice</h2>' +
      '<div class="field mt-6"><label class="label" for="askill">Skill</label><select class="input" id="askill" data-act-change="skill">' + opts + '</select></div>' +
      '<div class="field"><label class="label" for="atext">Passage</label><select class="input" id="atext" data-act-change="text"></select></div>' +
      '<div class="field"><label class="label" for="adue">Due</label><input class="input" id="adue" type="date" value="2026-10-08"></div>' +
      '<input type="hidden" id="aq" value="8"><div id="apreview" class="mt-6"></div>' +
      '<button class="btn btn-primary mt-8" type="submit">Assign to 20 students</button></form>' +
      '<section class="card pad"><h2 class="card-title">Current</h2><ul class="list mt-4">' + S.assignments.map(function (a) { return '<li><span><b>' + esc(a.title) + '</b><small>' + SKILL_NAMES[a.skill] + '. Due ' + a.due + '.</small></span><span class="muted" style="font-size:14px;">' + a.started + ' of ' + a.total + '</span></li>'; }).join('') + '</ul></section></div>');
  }

  function pTexts() {
    return teacherShell('texts',
      thead('Texts', 'Original passages for teens, tagged to the English I TEKS and the 2024 ELPS.') +
      '<section class="card pad mt-8"><div class="tbl-wrap" style="margin-top:0;"><table class="tbl"><thead><tr><th>Title</th><th>Type</th><th>ELPS level</th><th>TEKS</th><th></th></tr></thead><tbody>' +
      TEXTS.map(function (t) { return '<tr><td class="name"><b>' + esc(t.title) + '</b></td><td>' + t.type + '</td><td>' + t.level + '</td><td>' + t.teks.join(', ') + '</td><td style="text-align:right;"><button class="btn btn-secondary" type="button" data-act="assigntext" data-text="' + t.id + '" style="min-height:36px;padding:4px 14px;">Assign</button></td></tr>'; }).join('') +
      '</tbody></table></div></section>' +
      '<section class="card pad mt-8" id="sets"><div class="between wrap-row"><h2 class="card-title">Vocabulary sets</h2><button class="btn btn-secondary" type="button" data-act="makeset">' + I.plus + 'Make a set</button></div>' +
      S.sets.map(function (s) { return '<div class="mt-6"><b>' + esc(s.name) + '</b><div class="chips mt-3">' + s.words.map(function (w) { return '<span class="chip">' + esc(w) + '</span>'; }).join('') + '</div></div>'; }).join('') + '</section>');
  }

  function pReports() {
    var s = student(S.reportStudent);
    var body = S.reportTab === 'class'
      ? '<h2>Weekly class summary</h2><p class="muted" style="margin-top:4px;">ESOL I, 3rd block. Week of September 28, 2026.</p><p>Students finished 54 sessions. They missed 115 questions: 59 language gaps and 56 skill gaps.</p>' + GAPLEGEND + '<div class="mt-4">' + gapRows(SKILLS, 46) + '</div><h3>Next steps</h3><p>Preteach tryout, apron, tighter, responsibility, and choice. Reteach key ideas and summarizing with a model.</p>'
      : '<h2>' + esc(s.name) + '</h2><p class="muted" style="margin-top:4px;">Progress report. ' + s.level + '. For an LPAC or family meeting.</p><p>' + (s.id === 'daniela' ? 'Daniela went from 1 of 8 correct on her own (Sept 14) to 6 of 8 (Sept 28). She most often needs key words explained, which points to vocabulary. The inference skill itself is solid.' : esc(s.name.split(' ')[0]) + ' answered ' + s.own + '% of questions correctly with no support this week. Main area to grow: ' + s.gap.toLowerCase() + '.') + '</p><h3>Recommended supports</h3><p>Preteach key vocabulary. Keep Spanish support on new skills. Continue weekly spoken ACE responses for TELPAS practice.</p>';
    return teacherShell('reports',
      '<div class="noprint">' + thead('Reports', 'Print a report or save it as a PDF.', '<button class="btn btn-primary" type="button" data-act="print">' + I.down + 'Print or save as PDF</button>') +
      '<div class="tabs seg" role="group" aria-label="Report"><button type="button" data-act="rtab" data-tab="class" aria-pressed="' + (S.reportTab === 'class') + '">Class summary</button><button type="button" data-act="rtab" data-tab="student" aria-pressed="' + (S.reportTab === 'student') + '">Student report</button></div>' +
      (S.reportTab === 'student' ? '<div class="field mt-4" style="max-width:320px;"><label class="sr" for="rs">Student</label><select class="input" id="rs" data-act-change="rstudent">' + STUDENTS.map(function (x) { return '<option value="' + x.id + '"' + (x.id === s.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>' : '') + '</div>' +
      '<article class="card pad report mt-6">' + body + '</article>');
  }

/* ---------------- assign preview ---------------- */
  function fillAssign() {
    var sk = document.getElementById('askill'), tx = document.getElementById('atext'), pv = document.getElementById('apreview');
    if (!sk || !tx || !pv) { return; }
    var want = tx.getAttribute('data-want');
    var list = TEXTS.filter(function (t) { return t.teks.indexOf(sk.value) > -1; });
    tx.innerHTML = list.map(function (t) { return '<option value="' + t.id + '"' + (want === t.id ? ' selected' : '') + '>' + esc(t.title) + ' (' + t.level + ')</option>'; }).join('');
    var t = list.filter(function (x) { return x.id === tx.value; })[0] || list[0];
    pv.innerHTML = '<div class="example" style="margin-top:0;"><b>' + esc(t.title) + '</b><p class="mt-1">' + esc(t.about) + '</p><p class="muted mt-2" style="font-size:14px;">' + t.type + ', ' + t.level + '. ' + SKILL_NAMES[sk.value] + '. After a miss, each student climbs the ladder.</p></div>';
  }

  /* ---------------- router ---------------- */
  function route() {
    var h = (location.hash || '#/s/join').slice(1).split('/');
    var area = h[1], page = h[2], arg = h[3];
    var html;
    if (area === 't') {
      html = page === 'students' ? pStudents() : page === 'student' ? pStudent(arg) : page === 'review' ? pReview(arg) : page === 'assign' ? pAssign() : page === 'texts' ? pTexts() : page === 'reports' ? pReports() : pOverview();
    } else {
      html = page === 'today' ? pToday() : page === 'practice' ? pPractice() : page === 'respond' ? pRespond() : page === 'results' ? pResults() : page === 'progress' ? pProgress() : pJoin();
    }
    app.innerHTML = html;
    document.querySelectorAll('.demobar [data-demo]').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-demo') === (area === 't' ? 't' : 's')); });
    if (area === 't' && page === 'assign') { fillAssign(); }
    save();
  }
  function rerender(keepScroll) { var y = window.scrollY; route(); if (keepScroll) { window.scrollTo(0, y); } }
  window.addEventListener('hashchange', function () { route(); window.scrollTo(0, 0); });

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go && !e.target.closest('a')) { location.hash = go.getAttribute('data-go'); return; }
    var b = e.target.closest('[data-act]');
    if (!b) { return; }
    var act = b.getAttribute('data-act');
    if (act === 'seg') { b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }
    else if (act === 'listen') { speak(PASSAGE.paras.join(' '), 'en-US'); }
    else if (act === 'hear') { var r = RUNGS[S.rung]; speak(plain(r.q) + ' ' + r.choices.map(function (c, i) { return String.fromCharCode(65 + i) + '. ' + plain(c); }).join(' '), 'en-US'); if (r.qes) { setTimeout(function () { speak(r.qes, 'es-MX'); }, 50); } }
    else if (act === 'check') { if (S.picked === null) { return; } S.checked = true; if (S.picked === RUNGS[S.rung].correct || S.rung === RUNGS.length - 1) { S.done = true; S.finalRung = S.rung; } rerender(true); }
    else if (act === 'climb') { S.rung = Math.min(RUNGS.length - 1, S.rung + 1); S.picked = null; S.checked = false; rerender(true); }
    else if (act === 'mode') { S.mode = b.getAttribute('data-mode'); rerender(true); }
    else if (act === 'regrade') { rerender(true); toast('Feedback updated.'); }
    else if (act === 'send') { S.sent = true; location.hash = '#/s/results'; setTimeout(function () { toast('Sent to Ms. Ortiz.'); }, 100); }
    else if (act === 'rec') {
      var t = document.getElementById('rectext');
      if (b.classList.contains('on')) { b.classList.remove('on'); t.textContent = 'Recorded 0:38. Tap to record again.'; toast('Recording saved. This demo does not keep audio.'); }
      else { b.classList.add('on'); t.textContent = 'Recording\u2026 tap to stop'; }
    }
    else if (act === 'words') { toast('Word practice starts with tie, apron, and tighter.'); }
    else if (act === 'makeset') { S.sets.unshift({ name: 'Week of Sept 28 words', words: ['tryout', 'apron', 'responsibility', 'tighter', 'grill', 'choice'] }); save(); location.hash = '#/t/texts'; setTimeout(function () { var el = document.getElementById('sets'); if (el) { el.scrollIntoView({ behavior: 'smooth' }); } toast('Vocabulary set made from this week\u2019s words.'); }, 60); }
    else if (act === 'sort') { S.sort = S.sort === 'asc' ? 'desc' : 'asc'; rerender(true); }
    else if (act === 'class') { toast('This demo has one class.'); }
    else if (act === 'play') {
      var cur = RESPONSES.filter(function (r) { return r.id === S.selResp; })[0], tr = document.getElementById('ptrack');
      speak(cur.text, 'en-US');
      if (tr) { tr.style.transition = 'none'; tr.style.width = '0'; requestAnimationFrame(function () { tr.style.transition = 'width 6s linear'; tr.style.width = '100%'; }); }
    }
    else if (act === 'playq') { var rq = RESPONSES.filter(function (x) { return x.id === b.getAttribute('data-rid'); })[0]; if (rq) { speak(rq.text, 'en-US'); var tk = b.parentNode.querySelector('.track i'); if (tk) { tk.style.transition = 'none'; tk.style.width = '0'; requestAnimationFrame(function () { tk.style.transition = 'width 6s linear'; tk.style.width = '100%'; }); } } }
    else if (act === 'sendfb') {
      if (S.reviewed.indexOf(S.selResp) === -1) { S.reviewed.push(S.selResp); }
      var nxt = RESPONSES.filter(function (r) { return S.reviewed.indexOf(r.id) === -1; })[0];
      save(); toast('Feedback sent.');
      if (nxt) { location.hash = '#/t/review/' + nxt.id; } else { rerender(true); }
    }
    else if (act === 'assigntext') { location.hash = '#/t/assign'; var id = b.getAttribute('data-text'); setTimeout(function () { var t = TEXTS.filter(function (x) { return x.id === id; })[0]; var sk = document.getElementById('askill'); if (sk && t) { sk.value = t.teks[0]; document.getElementById('atext').setAttribute('data-want', t.id); fillAssign(); } }, 30); }
    else if (act === 'rtab') { S.reportTab = b.getAttribute('data-tab'); rerender(true); }
    else if (act === 'report') { S.reportTab = 'student'; S.reportStudent = b.getAttribute('data-sid'); location.hash = '#/t/reports'; }
    else if (act === 'print') { window.print(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'ans') { S.picked = +t.value; rerender(true); return; }
    if (t.hasAttribute('data-filter')) { S.filter[t.getAttribute('data-filter')] = t.value; rerender(true); return; }
    if (t.hasAttribute('data-tfilter')) { S.textFilter[t.getAttribute('data-tfilter')] = t.value; rerender(true); return; }
    var c = t.getAttribute('data-act-change');
    if (c === 'skill' || c === 'text') { fillAssign(); }
    if (c === 'rstudent') { S.reportStudent = t.value; rerender(true); }
    if (t.hasAttribute('data-rub')) { var ed = S.fbEdits[S.selResp] || (S.fbEdits[S.selResp] = {}); ed['r' + t.getAttribute('data-rub')] = t.checked; save(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-ace')) { S.ace[t.getAttribute('data-ace')] = t.value; save(); }
    if (t.hasAttribute('data-fb')) { var ed = S.fbEdits[S.selResp] || (S.fbEdits[S.selResp] = {}); ed[t.getAttribute('data-fb')] = t.value; save(); }
    if (t.getAttribute('data-filter') === 'q') { S.filter.q = t.value; var pos = t.selectionStart; rerender(true); var n = document.getElementById('fq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.getAttribute('data-form');
    if (!f) { return; }
    e.preventDefault();
    if (f === 'join') { location.hash = '#/s/today'; }
    if (f === 'assign') {
      var tx = document.getElementById('atext'), sk = document.getElementById('askill'), due = document.getElementById('adue').value;
      var t = TEXTS.filter(function (x) { return x.id === tx.value; })[0];
      var d = due ? new Date(due + 'T12:00:00') : null;
      S.assignments.unshift({ title: t.title, skill: sk.value, due: d ? d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : 'soon', started: 0, total: 20 });
      rerender(true); toast('Assigned to 20 students.');
    }
  });

  /* home link works on GitHub Pages and in the hosted preview */
  var home = document.getElementById('homelink');
  if (!/github\.io$/.test(location.hostname) && location.protocol !== 'file:') { home.href = 'https://claude.ai/artifact/QGMZyGqya9HurMXhoyYaLR'; home.target = '_top'; }

  /* fresh start for the student flow when it begins again */
  if (!location.hash || location.hash === '#/s/join') { S.rung = 0; S.picked = null; S.checked = false; S.done = false; S.finalRung = null; S.sent = false; S.ace = JSON.parse(JSON.stringify(DEFAULT.ace)); }
  route();
})();
</script>
</body>
</html>
